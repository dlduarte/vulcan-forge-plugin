buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        classpath 'io.github.dlduarte:vulcan-forge-gradle-plugin:1.1.0'
    }
}

plugins {
    id 'java'
}

apply plugin: 'io.github.dlduarte.publish'

group = 'com.example'
version = '1.0.0'

// A configuracao global vem do gradle.properties (vulcanforge.*), que aponta para o
// registry local (target=nexus) para este exemplo rodar de forma autocontida.
vulcanForge {
    // OBRIGATORIO: o que este projeto pode publicar. As tasks nao declaradas somem do
    // grupo 'vulcan forge' e falham se forem invocadas — e assim que um projeto que so
    // distribui o jar evita gerar uma imagem Docker por engano.
    enabledGoals = ['dockerPublish']   // ou ['vulcanMavenPublish'], ou as duas

    // Para escolher outro servidor por-projeto:
    // target = 'github'
    // namespace = 'minha-org'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.example.App'
    }
}
